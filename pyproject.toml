[build-system]
requires = ["setuptools==65.5.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sufficient-experience-distillation"
version = "0.1.0"
description = "Auditable black-box agent distillation research harness"
requires-python = ">=3.11"
dependencies = ["PyYAML==6.0.3"]

[project.optional-dependencies]
teacher = ["openai==2.8.1"]
student = ["httpx==0.28.1"]
training = ["transformers==5.14.1", "peft==0.20.0", "accelerate==1.14.0"]
alfworld = ["alfworld==0.4.2", "textworld[pddl]==1.7.0"]
test = ["pytest==7.4.0"]

[project.scripts]
sed-manifest = "sed.manifest:main"
sed-episode = "sed.runner:main"
sed-replay = "sed.runner:replay_main"
sed-suite = "eval.run_suite:main"
sed-dev40 = "sed.dev_subset:main"
sed-select-seeds = "sed.seed_selection:main"
sed-collect-seeds = "teachers.collect_seeds:main"
sed-sft = "train.sft:main"
sed-merge-lora = "train.merge_lora:main"

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["analysis", "analysis.mechanism*", "baselines*", "sed*", "harness*", "teachers*", "students*", "train*", "eval*", "tools*"]
exclude = ["tests*"]
namespaces = false

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
markers = ["integration: optional real ALFWorld reset and prefix replay"]
addopts = "-ra"
